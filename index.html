<!DOCTYPE html>
<html lang="km"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ដឹកដល់ផ្ទះ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f3f7fb;--card:#fff;--tx:#17324d;--mut:#6b7f94;--pri:#0b7a75;--pri2:#14b8a6;--bd:#d9e4ee;--red:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a26;--card:#182636;--tx:#e8f1f9;--mut:#93a8bc;--bd:#2a3d50;--pri:#14b8a6;--pri2:#0b7a75}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Khmer',system-ui,sans-serif;font-size:15px}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:14px;text-align:center;position:relative}
#logo{font-weight:700;line-height:1.4;word-break:break-word;padding:0 44px}
#logoBtn{position:absolute;right:8px;top:8px;background:#ffffff33;border:0;color:#fff;border-radius:50%;width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:17px;line-height:1}
#logoSet{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
#logoSet.on{display:block}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;position:sticky;top:0;font-size:17px}
.sb{padding:14px;max-width:640px;margin:auto}
.fc{background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:0 10px 30px rgba(11,122,117,.15);overflow:hidden;margin-bottom:10px}
#formTitle{color:var(--pri);font-weight:700;padding:14px 16px 0}#formTitle:empty{display:none}
.fh{display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff;font-size:18px;font-weight:700;background:radial-gradient(circle at 92% -10%,#ffffff55 0,transparent 42%),radial-gradient(circle at 8% 140%,#ffffff33 0,transparent 40%),linear-gradient(135deg,var(--pri),var(--pri2))}
.fi{width:46px;height:46px;flex:none;border-radius:15px;background:#ffffff30;border:1px solid #ffffff66;display:grid;place-items:center;font-size:22px}
.fh small{display:block;opacity:.88;font-weight:400;font-size:12px;margin-top:2px}
.item .b{border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.18);height:34px;width:34px;min-width:34px;padding:0;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.logo-only{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:12px}
.logo-only .ti{width:34px;height:34px;border-radius:11px}
.logo-only.big .ti{width:56px;height:56px;border-radius:18px}
.tgb{background:#fff!important;border:2px solid var(--mut)!important}
.fb{padding:6px 16px 14px}
.sec{font-weight:700;color:var(--pri);margin:16px 0 6px}
.fld{position:relative;margin-top:10px}.fld .ic{position:absolute;left:14px;top:24px;transform:translateY(-50%);pointer-events:none}
.fld input,.fld textarea{padding-left:42px;border-radius:14px;min-height:48px}
#phones .row input{min-height:48px;border-radius:14px}
.rq,.st{color:#5c3410;font-weight:700;font-size:10px;vertical-align:super}.rq{margin-left:3px}.st{margin-left:1px}
.fld.s input{padding-left:60px}
.gl-red{font:inherit;font-size:11px;font-weight:700;line-height:1;color:#fff;text-shadow:0 1px 2px rgba(120,0,0,.45);padding:5px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.65);background:linear-gradient(145deg,rgba(239,68,68,.78),rgba(185,28,28,.5));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 3px 8px rgba(220,38,38,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.dup{color:#e5484d;font-size:13px;font-weight:700;margin:4px 4px 0}.dup:empty{display:none}
#pv{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}#pv.on{display:block}
.pvr{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);margin-top:10px;word-break:break-word;min-height:48px}.pvr span{flex:none}
.pvbar{display:flex;justify-content:center;padding:12px 16px;background:var(--bg);border-top:1px solid var(--bd)}
.sm{padding:8px 12px;margin-top:8px}
.fbar{display:flex;justify-content:center;gap:14px;padding:12px 16px;background:var(--bg);border-top:1px solid var(--bd)}
.fbar .b{width:78px;height:54px;padding:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;line-height:1.2;flex:none}
.sv{background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 6px 14px rgba(20,184,166,.35)}
.ti{width:22px;height:22px;vertical-align:middle;object-fit:contain}
nav{display:flex;gap:4px;padding:8px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1;white-space:nowrap;padding:9px 10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit}
nav button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
nav button{background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,255,255,.4));-webkit-backdrop-filter:blur(10px) saturate(160%);backdrop-filter:blur(10px) saturate(160%);color:var(--tx);border:1px solid rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(31,100,130,.2),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(120,160,190,.28);font-weight:700}
nav button.on{background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(214,246,242,.6));color:var(--pri);border-color:var(--pri);box-shadow:0 0 0 3px rgba(20,184,166,.28),0 4px 14px rgba(31,100,130,.2),inset 0 1px 0 #fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) nav button{background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06));border-color:rgba(255,255,255,.35);color:#fff}:root:not([data-theme=light]) nav button.on{background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(20,184,166,.2));color:#fff;border-color:var(--pri)}}
main{max-width:640px;margin:auto;padding:8px 10px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button.b{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700}
button.r{background:var(--red)}button.g{background:var(--mut)}
.row{display:flex;gap:6px;align-items:center;margin-top:6px}.row input{flex:1}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.item .i{flex:1;min-width:0}.item small{color:var(--mut);display:block}
.sug{border:1px solid var(--bd);border-radius:10px;margin-top:4px;overflow:hidden}
.sug div{padding:9px 10px;border-bottom:1px solid var(--bd);background:var(--card)}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.tot{font-size:20px;font-weight:700;color:var(--pri);text-align:right;margin-top:8px}
.pg{display:none}.pg.on{display:block}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block;width:72mm;font-size:14px;color:#000;background:#fff}#pa h3{margin:0 0 4px}}

  db.d=ds.docs.flatMap(d=>d.data().rows||[]).filter(r=>Date.now()-r.t<=33*864e5);

 setSt('☁️ ភ្ជាប់ cloud');sync()}catch(e){setSt('📱 រក្សាទុកក្នុងទូរស័ព្ទ')}}

const tabs=['បញ្ចូល','📋 ផ្ទុកព័ត៌មាន','🔍 ចុចលេខដឹកជញ្ជូន','🕘 ប្រវត្តិ','💰 របាយការណ៍លុយដឹក'];
$('nav').innerHTML=tabs.map((t,i)=>`<button${i===0?' class="t0"':''} onclick="tab(${i})">${t}</button>`).join('');
function tab(i){document.querySelectorAll('.pg').forEach((p,j)=>p.classList.toggle('on',i===j));document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',i===j));
 if(i===1)renderList();if(i===2){renderQ();$('sq').focus()}if(i===3)renderHist();if(i===4){if(!$('dd').value)$('dd').value=dkey();renderDaily()}}
// logo
function renderLogo(){const l=db.logo;$('logo').textContent=l.t;$('logo').style.fontSize=l.s+'px';$('logo').style.color=l.c;$('lt').value=l.t;$('mt').value=db.msg;$('ls').value=l.s;$('lc').value=l.c}
function saveLogo(){db.logo={t:$('lt').value,s:+$('ls').value,c:$('lc').value};save();$('logo').textContent=db.logo.t;$('logo').style.fontSize=db.logo.s+'px';$('logo').style.color=db.logo.c}
function pruneQ(){const td=dkey(),n=db.q.length;db.q.forEach(x=>{if(!x.t)x.t=Date.now()});db.q=db.q.filter(x=>dkey(x.t)===td);if(db.q.length!==n){save();renderQ()}}
// form
function addPhone(v){const n=$('phones').children.length;if(n>=5)return alert('ច្រើនបំផុត ៥ លេខ');const r=document.createElement('div');r.className='wrap';r.innerHTML=`<div class="row"><input inputmode="numeric" autocomplete="off" placeholder="លេខទូរស័ព្ទ" value="${esc(v)}" oninput="chkDup(this)">${n?'<button class="b r" onclick="this.closest(\'.wrap\').remove()">✕</button>':''}</div><div class="dup"></div>`;$('phones').appendChild(r)}
function chkDup(i){const v=i.value.replace(/\s/g,''),d=i.closest('.wrap').querySelector('.dup');const c=v&&db.c.find(x=>x.id!==editId&&x.p.includes(v));
 if(c){d.textContent='⚠️ លេខនេះមានក្នុង “ផ្ទុកព័ត៌មាន” រួចហើយ'+(c.n?' ('+c.n+')':'');if(d._v!==v)toast('⚠️ លេខនេះមានរួចហើយ');d._v=v}else{d.textContent='';d._v=''}}
function qrImg(text,size,cb){const t=$('qtmp');t.innerHTML='';new QRCode(t,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});const c=t.querySelector('canvas');cb(c.toDataURL())}
function prevQR(){const v=$('fl').value.trim();$('fqr').innerHTML='';if(v)qrImg(v,130,u=>$('fqr').innerHTML=`<img src="${u}" width="130" height="130" alt="QR">`)}
function clearForm(){editId=null;['fn','fa','fl','ff','fnote'].forEach(i=>$(i).value='');$('phones').innerHTML='';addPhone('');$('fqr').innerHTML='';$('formTitle').textContent='';if(document.activeElement)document.activeElement.blur();setTimeout(()=>$('phones').querySelectorAll('input').forEach(i=>i.value=''),0)}
function toast(t){let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0b7a75;color:#fff;padding:10px 18px;border-radius:14px;z-index:99;box-shadow:0 6px 18px rgba(0,0,0,.25);font-weight:700;transition:opacity .3s';document.body.appendChild(e)}e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1800)}
function saveCust(){const ph=[...$('phones').querySelectorAll('input')].map(i=>i.value.replace(/\s/g,'')).filter(Boolean);
 if(!ph.length)return toast('⭐ សូមបញ្ចូលលេខទូរស័ព្ទ');
 const dup=ph.find((p,i)=>ph.indexOf(p)!==i||db.c.some(x=>x.id!==editId&&x.p.includes(p)));
 if(dup){[...$('phones').querySelectorAll('input')].forEach(chkDup);return toast('⛔ មិនអាចរក្សាទុក លេខ '+dup+' ស្ទួន')}
 if(!$('fn').value.trim())return toast('⭐ សូមបញ្ចូលឈ្មោះ');
 if(!$('fa').value.trim())return toast('⭐ សូមបញ្ចូលអាស័យដ្ឋាន');
 if($('ff').value==='')return toast('⭐ សូមបញ្ចូលថ្លៃសេវា');
 const wasEdit=!!editId;const o={id:editId||Date.now(),p:ph,n:$('fn').value.trim(),a:$('fa').value.trim(),l:$('fl').value.trim(),f:+$('ff').value||0,note:$('fnote').value.trim()};
 const i=db.c.findIndex(x=>x.id===o.id);i>=0?db.c[i]=o:db.c.unshift(o);save();clearForm();toast('✅ បានរក្សាទុក');if(wasEdit){tab(1);renderList();window.scrollTo(0,0)}}
function editCust(id){const c=db.c.find(x=>x.id===id);tab(0);editId=id;$('phones').innerHTML='';c.p.forEach(addPhone);$('fn').value=c.n;$('fa').value=c.a;$('fl').value=c.l;$('ff').value=c.f;$('fnote').value=c.note||'';prevQR();$('formTitle').textContent='✏️ កំពុងកែព័ត៌មាន'}
function delCust(id){if(confirm('លុបអតិថិជននេះ?')){db.c=db.c.filter(x=>x.id!==id);save();renderList()}}
function renderList(){const q=$('lq').value.trim().toLowerCase();const a=db.c.filter(c=>!q||(c.p.join(' ')+' '+c.n+' '+c.a).toLowerCase().includes(q));
 $('list').innerHTML=a.length?a.map(c=>`<div class="item"><div class="i" style="cursor:pointer" onclick="pv(${c.id})"><b>${esc(c.p.join(' · '))}</b><small>${esc(c.n)} — ${esc(c.a)}</small><small>${money(c.f)}${c.note?' · '+esc(c.note):''}</small></div><button class="b logo-only" onclick="tgMsg(${c.id},'${c.p[0]}')">${TIMG2}</button><button class="b" onclick="editCust(${c.id})">✏️</button><button class="b r" onclick="delCust(${c.id})">🗑️</button></div>`).join(''):'<small>មិនទាន់មានទិន្នន័យ</small>'}
// search
const allPhones=()=>db.c.flatMap(c=>c.p.map(p=>({cid:c.id,p})));
function sugg(){const v=$('sq').value.trim();if(!v){$('sug').innerHTML='';return}
 const m=allPhones().filter(x=>x.p.includes(v)).slice(0,8);
 $('sug').innerHTML=m.length?'<div class="sug">'+m.map(x=>{const c=db.c.find(k=>k.id===x.cid);return `<div onclick="scanPhone(${x.cid},'${x.p}');$('sq').value='';$('sug').innerHTML=''"><b>${x.p}</b> <small>${esc(c.n)}</small></div>`}).join('')+'</div>':''}
function addQ(cid,p){if(!db.q.some(x=>x.cid===cid&&x.p===p))db.q.push({cid,p,t:Date.now()});save();renderQ()}
function doSearch(){const v=$('sq').value.trim();if(!v)return;const m=allPhones().filter(x=>x.p===v);const r=m.length?m:allPhones().filter(x=>x.p.includes(v));
 if(!r.length){askBox(NEWT,NEWS,()=>newFromSearch(v));$('sq').value='';$('sug').innerHTML='';return}if(m.length===1)scanPhone(m[0].cid,m[0].p);else r.forEach(x=>addQ(x.cid,x.p));$('sq').value='';$('sug').innerHTML='';$('sq').focus()}
function renderQ(){$('queue').innerHTML=db.q.length?db.q.map((x,i)=>{const c=db.c.find(k=>k.id===x.cid);if(!c)return'';return `<div class="item"><span>📤</span><div class="i"><b>${x.p}</b><small>${esc(c.n)} · ${money(c.f)}${x.done?' · 🖨️ ព្រីនរួច':''}</small></div><button class="b logo-only" onclick="tgMsg(${x.cid},'${x.p}')">${TIMG2}</button><button class="b" onclick="printQ(${i})">ព្រីន</button></div>`}).join(''):'<small>គ្មានលទ្ធផល</small>'}
function printQ(i){const x=db.q[i];if(x)printEntry(x.cid,x.p,false,x)}
function printEntry(cid,p,auto,qi){const x={cid,p},c=db.c.find(k=>k.id===cid);if(!c)return;
 const go=u=>{$('pa').innerHTML=`<h3>${esc(x.p)}</h3><div>${esc(c.n)}</div><div>${esc(c.a)}</div><div><b>ថ្លៃសេវា៖ ${money(c.f)}</b></div>${u?`<img src="${u}" width="150" height="150" alt="QR">`:''}`;
  const img=$('pa').querySelector('img');const run=()=>{try{window.print()}catch(e){}const it=qi||db.q.find(y=>y.cid===x.cid&&y.p===x.p),ix=db.q.indexOf(it);if(!it||!it.done){const now=Date.now();db.h.unshift({t:now,p:x.p,n:c.n,f:c.f});db.d.push({t:now,k:dkey(now),p:x.p,f:c.f})}if(it){if(auto)it.done=true;else db.q.splice(ix,1)}save();renderQ()};
  img?(img.complete?run():img.onload=run):run()};
 c.l?qrImg(c.l,150,go):go('')}
function tgMsg(cid,p){const c=db.c.find(k=>k.id===cid);if(!c)return;
 const t=db.msg.replace('{ឈ្មោះ}',c.n).replace('{ថ្លៃ}',money(c.f));
 const n=p.replace(/\D/g,'').replace(/^0/,'855');
 try{navigator.clipboard.writeText(t)}catch(e){}
 setSt('📋 បានចម្លងសារ — Paste ក្នុង Telegram រួចចុចផ្ញើ');location.href='https://t.me/+'+n}
function scanPhone(cid,p){const td=dkey(),it=db.q.find(y=>y.cid===cid&&y.p===p);
 const seen=(it&&it.done)||db.d.some(z=>z.k===td&&z.p===p);
 const go=()=>{const n={cid,p,t:Date.now()};db.q.push(n);save();renderQ();if(db.auto)printEntry(cid,p,true,n)};
 if(seen)askDup(go);else if(it){if(db.auto)printEntry(cid,p,true,it)}else go()}
const SP='<span style="color:#059669;font-weight:800;font-size:1.25em">យល់ព្រម</span>';
const DUPT='⛄️ លេខនេះ ធ្លាប់ស្គេនរួចម្តងហើយ',DUPS='បើចុច “'+SP+'” គឺត្រូវគិតថ្លៃសេវាដឹកម្តងទៀត',NEWT='🚨 លេខនេះមិនទាន់បានរក្សាទុកនៅឡើយទេ',NEWS='សូមចុច “'+SP+'” ដើម្បីបញ្ចូលទៅក្នុងព័ត៌មានអតិថិជន';
function pv(id){const c=db.c.find(x=>x.id===id);if(!c)return;
 const row=(ic,t)=>t?`<div class="pvr"><span>${ic}</span><div>${esc(t)}</div></div>`:'';
 $('pvb').innerHTML=`<div class="fc"><div class="fb"><div class="sec">📱 លេខទូរស័ព្ទ</div>${c.p.map(p=>row('📞',p)).join('')}<div class="sec">👤 ព័ត៌មានអតិថិជន</div>${row('🙂',c.n)}${row('📍',c.a)}${row('🔗',c.l)}${row('💵',money(c.f))}${row('📝',c.note)}<div id="pvq" style="margin:12px 0;text-align:center"></div></div><div class="pvbar"><div class="item" style="border:0;padding:0"><button class="b" onclick="closePv();editCust(${c.id})" aria-label="កែ">✏️</button></div></div></div>`;
 $('pv').classList.add('on');$('pv').scrollTop=0;
 if(c.l)qrImg(c.l,130,u=>{$('pvq').innerHTML=`<img src="${u}" width="130" height="130" alt="QR" style="border-radius:10px;background:#fff;padding:6px">`})}
function closePv(){$('pv').classList.remove('on');$('lq').value='';$('lsug').innerHTML='';renderList()}
function lqGo(){$('lsug').innerHTML='';renderList();lqEnter()}
function lqSugg(){const raw=$('lq').value.trim(),v=raw.replace(/\s/g,''),q=raw.toLowerCase();if(!v){$('lsug').innerHTML='';return}
 const m=[];db.c.forEach(c=>c.p.forEach(p=>{if(p.includes(v)||(c.n||'').toLowerCase().includes(q))m.push({id:c.id,p,n:c.n})}));
 $('lsug').innerHTML=m.length?'<div class="sug">'+m.slice(0,8).map(x=>`<div onclick="$('lsug').innerHTML='';pv(${x.id})"><b>${x.p}</b> <small>${esc(x.n)}</small></div>`).join('')+'</div>':''}
function quickClear(){editId=null;['fn','fa','fl','ff','fnote'].forEach(i=>$(i).value='');const p=$('phones');while(p.children.length>1)p.lastChild.remove();const f=p.querySelector('input');if(f)f.value='';else addPhone('');p.querySelectorAll('.dup').forEach(d=>d.textContent='');$('fqr').innerHTML='';$('formTitle').textContent=''}
function askBox(t,sb,cb){const m=$('dm');$('dmt').textContent=t;$('dms').innerHTML=sb;m.style.display='flex';$('dok').onclick=()=>{m.style.display='none';cb()};$('dno').onclick=()=>{m.style.display='none';$('sq').value='';$('sq').focus()}}
function askDup(cb){askBox(DUPT,DUPS,cb)}
function lqEnter(){const v=$('lq').value.replace(/\s/g,'');if(/^\+?\d{6,}$/.test(v)&&!allPhones().some(x=>x.p.includes(v)))askBox(NEWT,NEWS,()=>newFromSearch(v))}
function newFromSearch(v){$('lq').value='';tab(0);clearForm();setTimeout(()=>{const i=$('phones').querySelector('input');if(i){i.value=v;chkDup(i)}$('fn').focus()},60)}
// history
function renderHist(){$('hist').innerHTML=db.h.length?db.h.map(r=>`<div class="item"><div class="i"><b>${r.p}</b><small>${esc(r.n)} · ${new Date(r.t).toLocaleString('en-GB')}</small></div><b>${money(r.f)}</b></div>`).join(''):'<small>គ្មានប្រវត្តិ</small>'}
// daily
function dayRows(){return db.d.filter(r=>r.k===$('dd').value)}
function dayOpts(){const sel=$('dd'),keep=sel.value||dkey();let h='';for(let i=0;i<33;i++){const k=dkey(Date.now()-i*864e5),n=db.d.filter(r=>r.k===k).length;h+=`<option value="${k}">${fmtD(k)}${i==0?' (ថ្ងៃនេះ)':''}${n?' · '+n+' កញ្ចប់':''}</option>`}sel.innerHTML=h;sel.value=keep}
function dayGo(n){const s=$('dd'),i=s.selectedIndex-n;if(i>=0&&i<s.options.length){s.selectedIndex=i;renderDaily()}}
function printRep(){const r=dayRows(),k=$('dd').value;$('pa').innerHTML=`<div style="white-space:pre-line;font-size:16px;line-height:1.7">📦 ${esc(db.logo.t)}

របាយការណ៍ថ្ងៃទី ${fmtD(k)}

ចំនួន ${r.length} កញ្ចប់
💰 សរុប៖ ${money(r.reduce((s,x)=>s+x.f,0))}</div>`;try{window.print()}catch(e){}}
function renderDaily(){dayOpts();const r=dayRows();$('dt').innerHTML=r.map((x,i)=>`<tr><td>${i+1}</td><td>${x.p}</td><td>${money(x.f)}</td></tr>`).join('')||'<tr><td colspan="3"><small>គ្មានទិន្នន័យ</small></td></tr>';$('dtot').textContent='សរុប៖ '+money(r.reduce((s,x)=>s+x.f,0))}
function tg(){const r=dayRows(),k=$('dd').value;const txt=`📦 ${db.logo.t}\nរបាយការណ៍ថ្ងៃទី ${fmtD(k)}\n`+r.map((x,i)=>`${i+1}. ${x.p} — ${money(x.f)}`).join('\n')+`\n━━━━━━\nចំនួន ${r.length} កញ្ចប់\n💰 សរុប៖ ${money(r.reduce((s,x)=>s+x.f,0))}`;
 location.href='https://t.me/share/url?url=%20&text='+encodeURIComponent(txt)}
renderLogo();clearForm();tab(0);$('auto').checked=db.auto;document.querySelectorAll('.tgi').forEach(e=>e.innerHTML=TIMG2);pruneQ();setInterval(pruneQ,60000);document.addEventListener('visibilitychange',pruneQ);loadRemote();
</script></body></html>
