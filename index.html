<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ចំរៀង និង រឿង</title>
<style>
:root{--bg:#0f1218;--card:#1a1f29;--tx:#eef2f8;--mut:#8b96a8;--pri:#ff7a1a;--bd:#2a3140;--red:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans Khmer","Khmer OS",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;overflow:auto;padding:12px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 4px;font:inherit;font-size:13px}
nav button.on{color:var(--pri);font-weight:700}nav b{display:block;font-size:20px}
.sec{display:none}.sec.on{display:block}
.b{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer;display:inline-block}
.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
input[type=url],select{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px;font:inherit;font-size:15px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.row.cur{border-color:var(--pri)}
.ic{font-size:24px}.nm{flex:1;min-width:0;cursor:pointer}
.nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small{color:var(--mut)}
.x{border:0;background:none;font-size:17px;padding:6px;color:var(--red)}
.pg{height:4px;background:var(--bd);border-radius:2px;margin-top:5px}.pg i{display:block;height:100%;background:var(--pri);border-radius:2px}
.empty{text-align:center;color:var(--mut);padding:36px 0}
.note{font-size:12px;color:var(--mut);margin:8px 0}
#msg{font-size:13px;white-space:pre-wrap;margin-top:8px}
#mp{background:var(--card);border-top:1px solid var(--bd);padding:8px 12px;display:none}
#mp.on{display:block}
#mp .t{display:flex;align-items:center;gap:6px}
#mp .t span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
#mp button{border:0;background:none;color:var(--tx);font-size:22px;padding:4px 8px}
#mp button.on{color:var(--pri)}
#sk{width:100%;accent-color:var(--pri)}
#vw{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:9;padding-top:env(safe-area-inset-top)}
#vw.on{display:flex}
#vt{display:flex;gap:8px;padding:8px;align-items:center}
#vt span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vv{flex:1;width:100%;min-height:0;background:#000}
</style>
</head>
<body>
<main>
 <section class="sec on" id="s0"><div id="ml"></div></section>
 <section class="sec" id="s1"><div id="vl"></div></section>
 <section class="sec" id="s2">
  <label class="b" style="width:100%;text-align:center;margin-bottom:12px">📲 ជ្រើសឯកសារពីទូរស័ព្ទ (ចំរៀង/រឿង)<input type="file" id="up" accept="audio/*,video/*,.mp3,.m4a,.mp4,.mkv,.webm" multiple hidden></label>
  <input type="url" id="du" placeholder="ឬ ដាក់ link ផ្ទាល់នៃឯកសារ (.mp4 / .mp3 ...)" inputmode="url">
  <select id="dk"><option value="auto">ដាក់ដោយស្វ័យប្រវត្តិ</option><option value="music">ចំរៀង</option><option value="movie">រឿង</option></select>
  <button class="b" id="dg" style="width:100%">⬇ ទាញយកពី link</button>
  <div class="pg" id="dp" style="display:none"><i style="width:0"></i></div>
  <div id="msg"></div>
  <div class="note">link ត្រូវជា link ឯកសារផ្ទាល់ ហើយ server ត្រូវអនុញ្ញាត។ បើទាញយកមិនបាន សូម download ឯកសារចូលទូរស័ព្ទជាមុន (Safari/Files) រួចចុច «ជ្រើសឯកសារ» ខាងលើ។</div>
  <div class="note" id="st"></div>
 </section>
</main>
<div id="mp">
 <div class="t"><span id="mt"></span><button id="sh">🔀</button><button id="pv">⏮</button><button id="pl">▶</button><button id="nx">⏭</button><button id="rp">🔁</button></div>
 <input type="range" id="sk" min="0" max="1000" value="0">
</div>
<nav>
 <button class="on" data-t="0"><b>🎵</b>ចំរៀង</button>
 <button data-t="1"><b>🎬</b>រឿង</button>
 <button data-t="2"><b>➕</b>បន្ថែម</button>
</nav>
<div id="vw"><div id="vt"><span id="vn"></span><a id="vd" class="b g" style="text-decoration:none">រក្សាទុក</a><button class="b g" id="vc">✕</button></div><video id="vv" controls playsinline></video></div>
<audio id="au"></audio>

<script>
const $=s=>document.querySelector(s),au=$("#au"),vv=$("#vv");
let db,music=[],movies=[],qi=-1,shuf=false,rep=0,aurl=null,vid=null,lastSave=0;
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open("boltmedia",1);
 r.onupgradeneeded=()=>{r.result.createObjectStore("meta",{keyPath:"id",autoIncrement:true});r.result.createObjectStore("blobs")};
 r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const rq=(st,m,f)=>new Promise((ok,no)=>{const t=db.transaction(st,m),r=f(t.objectStore(st));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sz=n=>n<1048576?(n/1024).toFixed(0)+" KB":n<1073741824?(n/1048576).toFixed(1)+" MB":(n/1073741824).toFixed(2)+" GB";
const tm=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
const EXT={mp3:"audio/mpeg",m4a:"audio/mp4",aac:"audio/aac",wav:"audio/wav",ogg:"audio/ogg",flac:"audio/flac",mp4:"video/mp4",m4v:"video/mp4",webm:"video/webm",mov:"video/quicktime",mkv:"video/x-matroska"};
const typeOf=(b,n)=>b.type||EXT[(n.split(".").pop()||"").toLowerCase()]||"";
const kindOf=t=>t.startsWith("audio/")?"music":"movie";

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
 document.querySelectorAll(".sec").forEach((s,i)=>s.classList.toggle("on",i==b.dataset.t))});

async function load(){const a=await rq("meta","readonly",s=>s.getAll());
 a.sort((x,y)=>x.name.localeCompare(y.name));
 music=a.filter(m=>m.kind==="music");movies=a.filter(m=>m.kind==="movie").sort((x,y)=>y.date-x.date);draw();storage()}
function draw(){
 $("#ml").innerHTML=music.length?music.map((m,i)=>`<div class="row ${i===qi?"cur":""}"><span class="ic">${i===qi&&!au.paused?"🔊":"🎵"}</span><div class="nm" data-p="${i}"><div>${esc(m.name)}</div><small>${sz(m.size)}</small></div><button class="x" data-d="${m.id}">🗑</button></div>`).join(""):'<div class="empty">មិនទាន់មានចំរៀង<br>ចុច ➕ ដើម្បីបន្ថែម</div>';
 $("#vl").innerHTML=movies.length?movies.map(m=>{const p=m.dur?Math.min(100,(m.pos||0)/m.dur*100):0;
  return `<div class="row"><span class="ic">🎬</span><div class="nm" data-v="${m.id}"><div>${esc(m.name)}</div><small>${sz(m.size)}${p>1?" · មើលបាន "+Math.round(p)+"%":""}</small><div class="pg"><i style="width:${p}%"></i></div></div><button class="x" data-d="${m.id}">🗑</button></div>`}).join(""):'<div class="empty">មិនទាន់មានរឿង<br>ចុច ➕ ដើម្បីបន្ថែម</div>';
 document.querySelectorAll("[data-p]").forEach(e=>e.onclick=()=>play(+e.dataset.p));
 document.querySelectorAll("[data-v]").forEach(e=>e.onclick=()=>watch(+e.dataset.v));
 document.querySelectorAll(".x").forEach(e=>e.onclick=()=>remove(+e.dataset.d))}
async function storage(){try{if(navigator.storage){await navigator.storage.persist();const e=await navigator.storage.estimate();$("#st").textContent="ទំហំប្រើ៖ "+sz(e.usage)+" / "+sz(e.quota)}}catch(e){}}
async function save(blob,name,kind){const t=typeOf(blob,name);if(!t){return false}
 if(kind==="auto"||!kind)kind=kindOf(t);
 const id=await rq("meta","readwrite",s=>s.add({name:name.replace(/\.[^.]+$/,""),file:name,type:t,kind,size:blob.size,date:Date.now(),pos:0,dur:0}));
 await rq("blobs","readwrite",s=>s.put(new Blob([blob],{type:t}),id));return true}
async function remove(id){if(!confirm("លុប?"))return;
 if(qi>=0&&music[qi]&&music[qi].id===id){au.pause();au.removeAttribute("src");qi=-1;$("#mp").classList.remove("on")}
 await rq("meta","readwrite",s=>s.delete(id));await rq("blobs","readwrite",s=>s.delete(id));load()}

// upload
$("#up").onchange=async e=>{let n=0;for(const f of e.target.files){if(await save(f,f.name,$("#dk").value))n++}
 e.target.value="";$("#msg").textContent="✅ បន្ថែមរួច "+n+" ឯកសារ";load()};

// download
$("#dg").onclick=async()=>{const u=$("#du").value.trim(),m=$("#msg"),pg=$("#dp");if(!u)return;
 m.textContent="កំពុងទាញយក...";pg.style.display="block";const bar=pg.firstChild;bar.style.width="0";
 try{const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);
  const len=+r.headers.get("content-length")||0,rd=r.body.getReader(),parts=[];let got=0;
  for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;
   bar.style.width=len?(got/len*100)+"%":"50%";m.textContent="កំពុងទាញយក "+sz(got)+(len?" / "+sz(len):"")}
  const name=decodeURIComponent(new URL(u).pathname.split("/").pop())||"file";
  const blob=new Blob(parts,{type:r.headers.get("content-type")||""});
  if(!(await save(blob,name,$("#dk").value)))throw new Error("មិនស្គាល់ប្រភេទឯកសារ");
  m.textContent="✅ រក្សាទុករួច៖ "+name;$("#du").value="";load()}
 catch(e){m.textContent="❌ ទាញយកមិនបាន៖ "+e.message+"\nសូម download ចូលទូរស័ព្ទជាមុន រួចចុច «ជ្រើសឯកសារ»។"}
 pg.style.display="none"};

// music
async function play(i){qi=i;const m=music[i];const b=await rq("blobs","readonly",s=>s.get(m.id));
 if(aurl)URL.revokeObjectURL(aurl);aurl=URL.createObjectURL(b);au.src=aurl;
 try{await au.play()}catch(e){}
 $("#mt").textContent=m.name;$("#mp").classList.add("on");draw();
 if("mediaSession" in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:m.name,artist:"ចំរៀងរបស់ខ្ញុំ"});
  navigator.mediaSession.setActionHandler("nexttrack",next);navigator.mediaSession.setActionHandler("previoustrack",prev)}}
function next(){if(!music.length)return;play(shuf?Math.floor(Math.random()*music.length):(qi+1)%music.length)}
function prev(){if(!music.length)return;if(au.currentTime>3)au.currentTime=0;else play((qi-1+music.length)%music.length)}
$("#pl").onclick=()=>au.paused?au.play():au.pause();
$("#nx").onclick=next;$("#pv").onclick=prev;
$("#sh").onclick=e=>{shuf=!shuf;e.target.classList.toggle("on",shuf)};
$("#rp").onclick=e=>{rep=(rep+1)%3;e.target.textContent=rep==2?"🔂":"🔁";e.target.classList.toggle("on",rep>0)};
au.onplay=au.onpause=()=>{$("#pl").textContent=au.paused?"▶":"⏸";draw()};
au.onended=()=>{if(rep==2)play(qi);else if(rep==1||qi<music.length-1||shuf)next();else draw()};
au.ontimeupdate=()=>{if(au.duration)$("#sk").value=au.currentTime/au.duration*1000};
$("#sk").oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};

// movies
async function watch(id){au.pause();const m=movies.find(x=>x.id===id),b=await rq("blobs","readonly",s=>s.get(id));
 vid=m;const u=URL.createObjectURL(b);vv.src=u;vv._u=u;$("#vn").textContent=m.name;$("#vd").href=u;$("#vd").download=m.file;
 $("#vw").classList.add("on");
 vv.onloadedmetadata=()=>{m.dur=vv.duration;if(m.pos>5&&m.pos<vv.duration-10)vv.currentTime=m.pos;vv.play().catch(()=>{})}}
async function savePos(){if(!vid)return;vid.pos=vv.currentTime;vid.dur=vv.duration||vid.dur;
 await rq("meta","readwrite",s=>s.put(vid))}
vv.ontimeupdate=()=>{const n=Date.now();if(n-lastSave>5000){lastSave=n;savePos()}};
vv.onpause=savePos;
$("#vc").onclick=async()=>{vv.pause();await savePos();$("#vw").classList.remove("on");URL.revokeObjectURL(vv._u);vv.removeAttribute("src");vid=null;load()};

open().then(d=>{db=d;load()}).catch(()=>{$("#ml").innerHTML='<div class="empty">មិនអាចប្រើ storage បាន</div>'});
</script>
</body>
</html>
