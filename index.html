<!DOCTYPE html>
<html lang="km"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ដឹកដល់ផ្ទះ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f3f7fb;--card:#fff;--tx:#17324d;--mut:#6b7f94;--pri:#0b7a75;--pri2:#14b8a6;--bd:#d9e4ee;--red:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a26;--card:#182636;--tx:#e8f1f9;--mut:#93a8bc;--bd:#2a3d50;--pri:#14b8a6;--pri2:#0b7a75}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Khmer',system-ui,sans-serif;font-size:15px}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:14px;text-align:center;position:relative}
#logo{font-weight:700;line-height:1.4;word-break:break-word}
#logoBtn{position:absolute;right:8px;top:8px;background:#ffffff33;border:0;color:#fff;border-radius:8px;padding:4px 8px}
#logoSet{display:none;background:var(--card);color:var(--tx);margin:10px;padding:10px;border-radius:12px;text-align:left}
#logoSet.on{display:block}
nav{display:flex;gap:4px;padding:8px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1;white-space:nowrap;padding:9px 10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:640px;margin:auto;padding:8px 10px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button.b{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700}
button.r{background:var(--red)}button.g{background:var(--mut)}
.row{display:flex;gap:6px;align-items:center;margin-top:6px}.row input{flex:1}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.item .i{flex:1;min-width:0}.item small{color:var(--mut);display:block}
.sug{border:1px solid var(--bd);border-radius:10px;margin-top:4px;overflow:hidden}
.sug div{padding:9px 10px;border-bottom:1px solid var(--bd);background:var(--card)}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.tot{font-size:20px;font-weight:700;color:var(--pri);text-align:right;margin-top:8px}
.pg{display:none}.pg.on{display:block}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block;width:72mm;font-size:14px;color:#000;background:#fff}#pa h3{margin:0 0 4px}}
</style></head><body>
<header><div id="logo"></div><div id="st" style="font-size:11px;opacity:.85;margin-top:4px"></div><button id="logoBtn" onclick="logoSet.classList.toggle('on')">⚙️ Logo</button></header>
<div id="logoSet">
<label>អក្សរ Logo</label><input id="lt" oninput="saveLogo()">
<div class="row"><span>ទំហំ</span><input id="ls" type="range" min="14" max="40" oninput="saveLogo()"><input id="lc" type="color" style="width:56px;padding:2px" oninput="saveLogo()"></div>
<div class="row"><button class="b r" onclick="lt.value='';saveLogo()">🗑️ លុបអក្សរ</button></div><label>សារផ្ញើអតិថិជន ({ឈ្មោះ} {ថ្លៃ} ជំនួសស្វ័យប្រវត្តិ)</label><textarea id="mt" rows="3" oninput="db.msg=this.value;save()"></textarea></div>
<nav id="nav"></nav>
<main>
<section class="pg" id="p0"><div class="card">
<b id="formTitle">ព័ត៌មានអតិថិជនថ្មី</b>
<label>លេខទូរស័ព្ទ (ច្រើនបំផុត ៥)</label><div id="phones"></div>
<button class="b g" style="margin-top:6px" onclick="addPhone('')">＋ បន្ថែមលេខ</button>
<label>ឈ្មោះ</label><input id="fn">
<label>ទីតាំង / អាស័យដ្ឋាន</label><input id="fa">
<label>Link ទីតាំង (ពី Telegram)</label><input id="fl" oninput="prevQR()" placeholder="https://...">
<div id="fqr" style="margin:8px 0"></div>
<label>ថ្លៃសេវា (៛)</label><input id="ff" type="number" inputmode="numeric" placeholder="2000">
<label>កំណត់ចំណាំ</label><textarea id="fnote" rows="2"></textarea>
<div class="row"><button class="b" style="flex:1" onclick="saveCust()">💾 រក្សាទុក</button><button class="b g" onclick="clearForm()">សម្អាត</button></div>
</div></section>

<section class="pg" id="p1"><input id="lq" placeholder="ស្វែងរកក្នុងផ្ទាំងផ្ទុក..." oninput="renderList()" style="margin-bottom:8px"><div class="card" id="list"></div></section>

<section class="pg" id="p2"><div class="card">
<b>ស្វែងរកលេខទូរស័ព្ទ</b>
<div class="row"><input id="sq" inputmode="numeric" placeholder="វាយ ឬ scan លេខ..." oninput="sugg()" onkeydown="if(event.key==='Enter')doSearch()"><button class="b" onclick="doSearch()">ស្វែងរក</button></div>
<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input id="auto" type="checkbox" style="width:auto" checked onchange="db.auto=this.checked;save()">🖨️ ព្រីនភ្លាមៗពេល scan / Enter</label><div id="sug"></div></div>
<div class="card"><div class="row" style="justify-content:space-between;margin:0"><b>លទ្ធផល</b><button class="b r" onclick="if(confirm('Reset?')){db.q=[];save();renderQ()}">Reset</button></div><div id="queue"></div></div></section>

<section class="pg" id="p3"><div class="card"><div class="row" style="justify-content:space-between;margin:0"><b>ប្រវត្តិព្រីន</b><button class="b r" onclick="if(confirm('លុបទាំងអស់?')){db.h=[];save();renderHist()}">🗑️</button></div><div id="hist"></div></div></section>

<section class="pg" id="p4"><div class="card">
<label>ជ្រើសថ្ងៃ (រក្សាទុក ៣៣ ថ្ងៃ)</label><input id="dd" type="date" onchange="renderDaily()">
<table style="margin-top:8px"><thead><tr><th>ល.រ</th><th>លេខទូរស័ព្ទ</th><th>ថ្លៃ</th></tr></thead><tbody id="dt"></tbody></table>
<div class="tot" id="dtot"></div>
<button class="b" style="width:100%;margin-top:10px" onclick="tg()">✈️ ផ្ញើចូល Telegram</button>
</div></section>
</main>
<div id="dm" style="display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center;padding:16px"><div class="card" style="max-width:320px;width:100%;text-align:center;margin:0"><div style="font-size:17px;font-weight:700;margin-bottom:6px">លេខនេះធ្លាប់ស្គេនម្តងរួចហើយ</div><div style="color:var(--mut);margin-bottom:14px">បើចុចយល់ព្រម គឺត្រូវគិតថ្លៃសេវាដឹកម្តងទៀត</div><div class="row" style="justify-content:space-between"><button class="b" id="dok" style="background:#6ee7b7;color:#064e3b">យល់ព្រម</button><button class="b r" id="dno">បោះបង់</button></div></div></div>
<div id="pa"></div>
<div id="qtmp" style="display:none"></div>
<script>
const $=id=>document.getElementById(id);
let db={c:[],h:[],d:[],q:[],logo:{t:'វីរះប៊ុនថាំ ត្មាតពង ដឹកដល់ផ្ទះ',s:24,c:'#ffffff'}},editId=null;
try{const x=JSON.parse(localStorage.getItem('dh')||'null');if(x)db=Object.assign(db,x)}catch(e){}
if(db.auto===undefined)db.auto=true;
if(db.msg===undefined)db.msg='សួស្តី {ឈ្មោះ} 🙏 ឥវ៉ាន់របស់លោកអ្នកកំពុងដឹកទៅដល់ផ្ទះ។ ថ្លៃសេវា {ថ្លៃ} សូមអរគុណ។';
let DB=null,last={},tm=null;
const setSt=t=>{$('st').textContent=t};
const save=()=>{try{localStorage.setItem('dh',JSON.stringify(db))}catch(e){}clearTimeout(tm);tm=setTimeout(sync,700)};
async function sync(){if(!DB)return;try{
 const put=async(p,d)=>{const s=JSON.stringify(d);if(last[p]===s)return;await DB.doc(p).set(d);last[p]=s};
 await put('cfg/main',{logo:db.logo,q:db.q,h:db.h.slice(0,300),auto:db.auto,msg:db.msg});
 const ids=new Set(db.c.map(c=>'cust/'+c.id));
 for(const c of db.c)await put('cust/'+c.id,c);
 const days={};db.d.forEach(r=>(days[r.k]=days[r.k]||[]).push(r));
 for(const k in days)await put('day/'+k,{rows:days[k]});
 for(const p of Object.keys(last))if((p.startsWith('cust/')&&!ids.has(p))||(p.startsWith('day/')&&!days[p.slice(4)])){await DB.doc(p).delete();delete last[p]}
 setSt('☁️ រក្សាទុករួច')}catch(e){setSt('⚠️ រក្សាទុក cloud មិនបាន')}}
async function loadRemote(){try{
 if(!window.claude){setSt('📱 រក្សាទុកក្នុងទូរស័ព្ទ');return}
 DB=await claude.use('db');if(!DB){setSt('📱 រក្សាទុកក្នុងទូរស័ព្ទ');return}
 const [cf,cs,ds]=await Promise.all([DB.doc('cfg/main').get(),DB.collection('cust').get(),DB.collection('day').get()]);
 if(cf.exists||!cs.empty){const g=cf.exists?cf.data():{};
  db.c=cs.docs.map(d=>d.data());db.logo=g.logo||db.logo;db.q=g.q||[];db.h=g.h||[];if(g.auto!==undefined)db.auto=g.auto;if(g.msg)db.msg=g.msg;
  db.d=ds.docs.flatMap(d=>d.data().rows||[]).filter(r=>Date.now()-r.t<=33*864e5);
  cs.docs.forEach(d=>last['cust/'+d.id]=JSON.stringify(d.data()));ds.docs.forEach(d=>last['day/'+d.id]=JSON.stringify(d.data()));if(cf.exists)last['cfg/main']=JSON.stringify(g);
  try{localStorage.setItem('dh',JSON.stringify(db))}catch(e){}
  renderLogo();$('auto').checked=db.auto;renderList();renderQ();renderHist();renderDaily()}
 setSt('☁️ ភ្ជាប់ cloud');sync()}catch(e){setSt('📱 រក្សាទុកក្នុងទូរស័ព្ទ')}}
const dkey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=k=>k.split('-').reverse().join('/');
const money=n=>Number(n||0).toLocaleString('en-US')+' ៛';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
db.d=db.d.filter(r=>Date.now()-r.t<=33*864e5);save();
// tabs
const tabs=['➕ បញ្ចូល','📋 ផ្ទុកព័ត៌មាន','🔍 ស្វែងរក','🕘 ប្រវត្តិ','💰 ប្រចាំថ្ងៃ'];
$('nav').innerHTML=tabs.map((t,i)=>`<button onclick="tab(${i})">${t}</button>`).join('');
function tab(i){document.querySelectorAll('.pg').forEach((p,j)=>p.classList.toggle('on',i===j));document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',i===j));
 if(i===1)renderList();if(i===2){renderQ();$('sq').focus()}if(i===3)renderHist();if(i===4){if(!$('dd').value)$('dd').value=dkey();renderDaily()}}
// logo
function renderLogo(){const l=db.logo;$('logo').textContent=l.t;$('logo').style.fontSize=l.s+'px';$('logo').style.color=l.c;$('lt').value=l.t;$('mt').value=db.msg;$('ls').value=l.s;$('lc').value=l.c}
function saveLogo(){db.logo={t:$('lt').value,s:+$('ls').value,c:$('lc').value};save();$('logo').textContent=db.logo.t;$('logo').style.fontSize=db.logo.s+'px';$('logo').style.color=db.logo.c}
// form
function addPhone(v){const n=$('phones').children.length;if(n>=5)return alert('ច្រើនបំផុត ៥ លេខ');const r=document.createElement('div');r.className='row';r.innerHTML=`<input inputmode="numeric" placeholder="លេខទូរស័ព្ទ" value="${esc(v)}"><button class="b r" onclick="this.parentNode.remove()">✕</button>`;$('phones').appendChild(r)}
function qrImg(text,size,cb){const t=$('qtmp');t.innerHTML='';new QRCode(t,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});const c=t.querySelector('canvas');cb(c.toDataURL())}
function prevQR(){const v=$('fl').value.trim();$('fqr').innerHTML='';if(v)qrImg(v,130,u=>$('fqr').innerHTML=`<img src="${u}" width="130" height="130" alt="QR">`)}
function clearForm(){editId=null;['fn','fa','fl','ff','fnote'].forEach(i=>$(i).value='');$('phones').innerHTML='';addPhone('');$('fqr').innerHTML='';$('formTitle').textContent='ព័ត៌មានអតិថិជនថ្មី'}
function saveCust(){const ph=[...$('phones').querySelectorAll('input')].map(i=>i.value.replace(/\s/g,'')).filter(Boolean);
 if(!ph.length)return alert('សូមបញ្ចូលលេខទូរស័ព្ទ');
 const o={id:editId||Date.now(),p:ph,n:$('fn').value.trim(),a:$('fa').value.trim(),l:$('fl').value.trim(),f:+$('ff').value||0,note:$('fnote').value.trim()};
 const i=db.c.findIndex(x=>x.id===o.id);i>=0?db.c[i]=o:db.c.unshift(o);save();clearForm();alert('✅ បានរក្សាទុក')}
function editCust(id){const c=db.c.find(x=>x.id===id);tab(0);editId=id;$('phones').innerHTML='';c.p.forEach(addPhone);$('fn').value=c.n;$('fa').value=c.a;$('fl').value=c.l;$('ff').value=c.f;$('fnote').value=c.note||'';prevQR();$('formTitle').textContent='កែព័ត៌មាន'}
function delCust(id){if(confirm('លុបអតិថិជននេះ?')){db.c=db.c.filter(x=>x.id!==id);save();renderList()}}
function renderList(){const q=$('lq').value.trim().toLowerCase();const a=db.c.filter(c=>!q||(c.p.join(' ')+' '+c.n+' '+c.a).toLowerCase().includes(q));
 $('list').innerHTML=a.length?a.map(c=>`<div class="item"><div class="i"><b>${esc(c.p.join(' · '))}</b><small>${esc(c.n)} — ${esc(c.a)}</small><small>${money(c.f)}${c.note?' · '+esc(c.note):''}</small></div><button class="b g" onclick="tgMsg(${c.id},'${c.p[0]}')">✈️</button><button class="b" onclick="editCust(${c.id})">✏️</button><button class="b r" onclick="delCust(${c.id})">🗑️</button></div>`).join(''):'<small>មិនទាន់មានទិន្នន័យ</small>'}
// search
const allPhones=()=>db.c.flatMap(c=>c.p.map(p=>({cid:c.id,p})));
function sugg(){const v=$('sq').value.trim();if(!v){$('sug').innerHTML='';return}
 const m=allPhones().filter(x=>x.p.includes(v)).slice(0,8);
 $('sug').innerHTML=m.length?'<div class="sug">'+m.map(x=>{const c=db.c.find(k=>k.id===x.cid);return `<div onclick="scanPhone(${x.cid},'${x.p}');$('sq').value='';$('sug').innerHTML=''"><b>${x.p}</b> <small>${esc(c.n)}</small></div>`}).join('')+'</div>':''}
function addQ(cid,p){if(!db.q.some(x=>x.cid===cid&&x.p===p))db.q.push({cid,p});save();renderQ()}
function doSearch(){const v=$('sq').value.trim();if(!v)return;const m=allPhones().filter(x=>x.p===v);const r=m.length?m:allPhones().filter(x=>x.p.includes(v));
 if(!r.length)alert('រកមិនឃើញ');if(m.length===1)scanPhone(m[0].cid,m[0].p);else r.forEach(x=>addQ(x.cid,x.p));$('sq').value='';$('sug').innerHTML='';$('sq').focus()}
function renderQ(){$('queue').innerHTML=db.q.length?db.q.map((x,i)=>{const c=db.c.find(k=>k.id===x.cid);if(!c)return'';return `<div class="item"><span>📤</span><div class="i"><b>${x.p}</b><small>${esc(c.n)} · ${money(c.f)}${x.done?' · 🖨️ ព្រីនរួច':''}</small></div><button class="b g" onclick="tgMsg(${x.cid},'${x.p}')">✈️</button><button class="b" onclick="printQ(${i})">ព្រីន</button><button class="b r" onclick="db.q.splice(${i},1);save();renderQ()">🗑️</button></div>`}).join(''):'<small>គ្មានលទ្ធផល</small>'}
function printQ(i){const x=db.q[i];if(x)printEntry(x.cid,x.p,false,x)}
function printEntry(cid,p,auto,qi){const x={cid,p},c=db.c.find(k=>k.id===cid);if(!c)return;
 const go=u=>{$('pa').innerHTML=`<h3>${esc(x.p)}</h3><div>${esc(c.n)}</div><div>${esc(c.a)}</div><div><b>ថ្លៃសេវា៖ ${money(c.f)}</b></div>${u?`<img src="${u}" width="150" height="150" alt="QR">`:''}`;
  const img=$('pa').querySelector('img');const run=()=>{try{window.print()}catch(e){}const it=qi||db.q.find(y=>y.cid===x.cid&&y.p===x.p),ix=db.q.indexOf(it);if(!it||!it.done){const now=Date.now();db.h.unshift({t:now,p:x.p,n:c.n,f:c.f});db.d.push({t:now,k:dkey(now),p:x.p,f:c.f})}if(it){if(auto)it.done=true;else db.q.splice(ix,1)}save();renderQ()};
  img?(img.complete?run():img.onload=run):run()};
 c.l?qrImg(c.l,150,go):go('')}
function tgMsg(cid,p){const c=db.c.find(k=>k.id===cid);if(!c)return;
 const t=db.msg.replace('{ឈ្មោះ}',c.n).replace('{ថ្លៃ}',money(c.f));
 const n=p.replace(/\D/g,'').replace(/^0/,'855');
 try{navigator.clipboard.writeText(t)}catch(e){}
 setSt('📋 បានចម្លងសារ — Paste ក្នុង Telegram រួចចុចផ្ញើ');window.open('https://t.me/+'+n,'_blank')}
function scanPhone(cid,p){const td=dkey(),it=db.q.find(y=>y.cid===cid&&y.p===p);
 const seen=(it&&it.done)||db.d.some(z=>z.k===td&&z.p===p);
 const go=()=>{const n={cid,p};db.q.push(n);save();renderQ();if(db.auto)printEntry(cid,p,true,n)};
 if(seen)askDup(go);else if(it){if(db.auto)printEntry(cid,p,true,it)}else go()}
function askDup(cb){const m=$('dm');m.style.display='flex';$('dok').onclick=()=>{m.style.display='none';cb()};$('dno').onclick=()=>{m.style.display='none';$('sq').value='';$('sq').focus()}}
// history
function renderHist(){$('hist').innerHTML=db.h.length?db.h.map(r=>`<div class="item"><div class="i"><b>${r.p}</b><small>${esc(r.n)} · ${new Date(r.t).toLocaleString('en-GB')}</small></div><b>${money(r.f)}</b></div>`).join(''):'<small>គ្មានប្រវត្តិ</small>'}
// daily
function dayRows(){return db.d.filter(r=>r.k===$('dd').value)}
function renderDaily(){const r=dayRows();$('dt').innerHTML=r.map((x,i)=>`<tr><td>${i+1}</td><td>${x.p}</td><td>${money(x.f)}</td></tr>`).join('')||'<tr><td colspan="3"><small>គ្មានទិន្នន័យ</small></td></tr>';$('dtot').textContent='សរុប៖ '+money(r.reduce((s,x)=>s+x.f,0))}
function tg(){const r=dayRows(),k=$('dd').value;const txt=`📦 ${db.logo.t}\nរបាយការណ៍ថ្ងៃទី ${fmtD(k)}\n`+r.map((x,i)=>`${i+1}. ${x.p} — ${money(x.f)}`).join('\n')+`\n━━━━━━\nចំនួន ${r.length} កញ្ចប់\n💰 សរុប៖ ${money(r.reduce((s,x)=>s+x.f,0))}`;
 window.open('https://t.me/share/url?url=%20&text='+encodeURIComponent(txt),'_blank')}
renderLogo();clearForm();tab(0);$('auto').checked=db.auto;loadRemote();
</script></body></html>
