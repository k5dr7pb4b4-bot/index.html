<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ទូទាត់ COD</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f6f1e9;--card:#fff;--ink:#231a12;--mute:#7a6d60;--line:#e2d8ca;--or:#e8660c;--or2:#fff0e4;--usd:#1b7a4b;--khr:#2b5fa8;--danger:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120d;--card:#241d16;--ink:#f4ece1;--mute:#a89a8a;--line:#3a3025;--or:#ff8a3d;--or2:#33231a;--usd:#5fd39a;--khr:#7fb0f0;--danger:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Khmer","Khmer OS",system-ui,sans-serif;font-size:15px}
body{padding:10px 10px 40px;max-width:760px;margin:0 auto}
h1{font-size:18px;margin:6px 2px 10px}
h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
button{font:inherit;border:0;border-radius:8px;padding:9px 12px;background:var(--or);color:#fff;font-weight:600;cursor:pointer}
button.g{background:var(--or2);color:var(--or);border:1px solid var(--or)}
button.x{background:transparent;color:var(--danger);padding:4px 8px;font-size:18px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--or);outline-offset:1px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px;min-width:0}
input:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#cam{display:none;position:relative;margin-top:8px}
#cam video{width:100%;border-radius:8px;max-height:300px;object-fit:cover;background:#000}
#cam .box{position:absolute;inset:20% 20%;border:3px solid var(--or);border-radius:10px;pointer-events:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.col.u{border-top:4px solid var(--usd)}.col.k{border-top:4px solid var(--khr)}
.col h2{display:flex;justify-content:space-between}
.item{border-bottom:1px dashed var(--line);padding:6px 0}
.item .t{display:flex;align-items:center;gap:4px;font-weight:600;font-size:16px}
.item .t span{flex:1;word-break:break-all}
.item small{color:var(--mute);display:block;font-size:11px;word-break:break-all}
.item .e{display:flex;gap:4px;margin-top:4px}
.item .e select{flex:0 0 46%;font-size:12px;padding:4px}
.item .e input{flex:1;width:0;font-size:13px;padding:4px}
.tot{margin-top:8px;font-size:17px;font-weight:700}
.u .tot{color:var(--usd)}.k .tot{color:var(--khr)}
.empty{color:var(--mute);font-size:13px;padding:8px 0}
.share{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.share button{padding:12px 6px}
#bq{max-width:150px;border-radius:8px;border:1px solid var(--line);display:block;margin:8px 0}
.acc{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.acc div{flex:1;min-width:0;word-break:break-all}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--or)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(92vw,360px);padding:14px}
#accs{display:none}
.qb img{width:100%;max-width:200px;display:block;margin:8px auto 0;border-radius:6px;background:#fff;padding:6px}
dialog::backdrop{background:rgba(0,0,0,.55)}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;background:var(--or2);color:var(--or);border:1px solid var(--line)}
.seg button.on{background:var(--or);color:#fff}
#amt{width:100%;font-size:26px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;display:none;z-index:99;max-width:90vw}
</style>
</head>
<body>
<h1>ទូទាត់ COD ទៅក្រុមហ៊ុន</h1>

<div class="card">
  <div class="row">
    <button id="bScan">ស្កេន QR កញ្ចប់</button>
    <button class="g" id="bMan">+ បញ្ចូលដោយដៃ</button>
    <button class="g" id="bImg">ថតរូបអាន COD</button>
    <input type="file" id="fImg" accept="image/*" capture="environment" hidden>
  </div>
  <div id="cam"><video id="v" playsinline muted></video><div class="box"></div></div>
</div>

<div class="cols">
  <div class="col u"><h2><span>ដុល្លារ $</span><span id="nU">0</span></h2><div id="lU"></div><div class="tot" id="tU"></div><div id="qU" class="qb"></div></div>
  <div class="col k"><h2><span>ប្រាក់រៀល ៛</span><span id="nK">0</span></h2><div id="lK"></div><div class="tot" id="tK"></div><div id="qK" class="qb"></div></div>
</div>

<div class="card" style="margin-top:10px">
  <h2>ធនាគារ</h2>
  <div class="row"><input type="checkbox" id="qOn" aria-label="ជ្រើស QR"><b>QR ABA + គណនី</b>
    <button class="g" id="bQ">ដាក់/ប្តូររូប QR</button><button class="x" id="bQd" aria-label="លុប QR">✕</button>
    <input type="file" id="fQ" accept="image/*" hidden></div>
  <img id="bq" alt="QR ABA" hidden>
  <b style="display:block;margin-top:10px">លេខគណនី</b>
  <div id="accs"></div>
  <div class="row" style="margin-top:8px">
    <input id="an" placeholder="ឈ្មោះ/ធនាគារ" style="flex:1 1 40%"><input id="ano" placeholder="លេខគណនី" inputmode="numeric" style="flex:1 1 40%">
    <button id="aAdd">រក្សាទុក</button>
  </div>
</div>

<div class="share">
  <button id="sU" style="background:var(--usd)">ចែករំលែក ដុល្លារ</button>
  <button id="sK" style="background:var(--khr)">ចែករំលែក ប្រាក់រៀល</button>
</div>
<div class="row" style="margin-top:10px;justify-content:space-between">
  <span style="color:var(--mute);font-size:12px">ទិន្នន័យរក្សាទុកក្នុងទូរស័ព្ទនេះ</span>
  <button id="bSave">រក្សាទុកទាំងអស់</button><button class="g" id="bClr">លុបទាំងអស់</button>
</div>

<dialog id="dlg">
  <b>បន្ថែមទឹកប្រាក់ COD</b>
  <small id="dcode" style="display:block;color:var(--mute);word-break:break-all"></small>
  <div class="seg"><button id="cU" class="on">$ ដុល្លារ</button><button id="cK">៛ រៀល</button></div>
  <input id="amt" inputmode="decimal" placeholder="0">
  <div class="row" style="margin-top:10px;justify-content:flex-end"><button class="g" id="dNone">គ្មាន COD</button><button class="g" id="dNo">បោះបង់</button><button id="dOk">បន្ថែម</button></div>
</dialog>
<dialog id="cdlg"><div id="cmsg" style="margin-bottom:12px"></div><div class="row" style="justify-content:flex-end"><button class="g" id="cNo">បោះបង់</button><button id="cYes" style="background:var(--danger)">យល់ព្រម</button></div></dialog>
<dialog id="adlg"><b>កែគណនី</b><input id="en" placeholder="ឈ្មោះ/ធនាគារ" style="width:100%;margin:8px 0"><input id="eno" placeholder="លេខគណនី" inputmode="numeric" style="width:100%"><div class="row" style="margin-top:10px;justify-content:flex-end"><button class="g" id="eNo">បោះបង់</button><button id="eOk">រក្សាទុក</button></div></dialog>
<dialog id="sdlg"><b>ចែករំលែក</b><textarea id="stxt" hidden rows="8" readonly style="width:100%;margin:8px 0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px"></textarea><img id="simg" alt="QR" hidden style="max-width:240px;width:100%;background:#fff;display:block;margin:0 auto 8px"><small style="color:var(--mute)">ចុចយូរលើរូប QR រួចជ្រើសរើស «Share»</small><div class="row" style="margin-top:10px;justify-content:flex-end"><button class="g" id="sClose">បិទ</button><button id="sCopy" hidden>ចម្លងអត្ថបទ</button></div></dialog>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
let S={items:[],skip:[],emv:null,qr:null,qrOn:false,accs:[],last:'USD'};
const KEY='codpay.v1';
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const fmt=(n,c)=>c==='USD'?Number(n).toFixed(2):Math.round(n).toLocaleString('en-US');
const sum=c=>S.items.filter(i=>i.cur===c).reduce((a,i)=>a+i.amt,0);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),90)}catch(e){}}

function render(){
  for(const [c,l,n,t] of [['USD','lU','nU','tU'],['KHR','lK','nK','tK']]){
    const list=S.items.filter(i=>i.cur===c);
    $(l).innerHTML=list.length?list.map((i,k)=>`<div class="item"><div class="t"><span>${k+1}. ${fmt(i.amt,c)}</span><button class="x" onclick="del('${i.id}')" aria-label="លុប">✕</button></div>${i.code||i.ai?`<small>${esc(i.code)}${i.ai?' · AI':''}</small>`:''}
      <div class="e"><select onchange="selEdit('${i.id}',this)" aria-label="កែទឹកប្រាក់"><option value="">កែទឹកប្រាក់</option><option value="USD">កែជា $</option><option value="KHR">កែជា ៛</option></select>
      <input id="in${i.id}" disabled inputmode="decimal" placeholder="..." onkeydown="if(event.key==='Enter')applyEdit('${i.id}')" onchange="applyEdit('${i.id}')"></div></div>`).join(''):'<div class="empty">មិនទាន់មាន</div>';
    $(n).textContent=list.length+' កញ្ចប់';
    $(t).innerHTML='សរុប: '+fmt(sum(c),c)+(c==='USD'?' $':' ៛')+' <button class="g" style="padding:4px 10px;font-size:13px" onclick="copyNum(\''+c+'\')">ចម្លង</button>';
  }
  drawQR();$('qOn').checked=!!S.qrOn;{const a=S.accs[0],ae=document.activeElement;if(ae!==$('an')&&ae!==$('ano')){$('an').value=a?a.name:'';$('ano').value=a?a.no:''}}
  $('bq').hidden=!S.qr;if(S.qr)$('bq').src=S.qr;
  $('accs').innerHTML=S.accs.length?S.accs.map(a=>`<div class="acc"><input type="checkbox" ${a.on?'checked':''} onchange="tickAcc('${a.id}',this.checked)" aria-label="ជ្រើស"><div><b>${esc(a.name)}</b><br>${esc(a.no)}</div><button class="g" onclick="editAcc('${a.id}')">កែ</button><button class="x" onclick="delAcc('${a.id}')" aria-label="លុប">✕</button></div>`).join(''):'<div class="empty">មិនទាន់មានលេខគណនី</div>';
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

function del(id){S.items=S.items.filter(i=>i.id!==id);save();render()}
function selEdit(id,sel){const inp=$('in'+id);inp.dataset.cur=sel.value;inp.disabled=!sel.value;inp.value='';if(sel.value)inp.focus()}
function applyEdit(id){
  const inp=$('in'+id);if(!inp||inp.disabled)return;
  const v=parseFloat(String(inp.value).replace(/,/g,''));const c=inp.dataset.cur;
  if(!c||!(v>=0)||inp.value==='')return;
  const it=S.items.find(i=>i.id===id);if(!it)return;
  it.cur=c;it.amt=c==='USD'?Math.round(v*100)/100:Math.round(v);save();render();
}

/* dialog */
let dCur='USD',dCode='';
function setCur(c){dCur=c;$('cU').classList.toggle('on',c==='USD');$('cK').classList.toggle('on',c==='KHR')}
$('cU').onclick=()=>setCur('USD');$('cK').onclick=()=>setCur('KHR');
function openAmt(code,cur,amt){
  dCode=code||'';$('dcode').textContent=dCode;setCur(cur||S.last||'USD');$('amt').value=amt||'';
  if(!$('dlg').open)$('dlg').showModal();setTimeout(()=>$('amt').focus(),50);
}
$('dNo').onclick=()=>$('dlg').close();
$('dNone').onclick=()=>{if(dCode&&!S.skip.includes(dCode)){S.skip.push(dCode);save()}$('dlg').close();toast('គ្មាន COD រំលង')};
$('dOk').onclick=()=>{
  const v=parseFloat(String($('amt').value).replace(/,/g,''));
  if(!(v>0)){toast('សូមបញ្ចូលចំនួនទឹកប្រាក់');return}
  S.items.push({id:uid(),code:dCode,cur:dCur,amt:dCur==='USD'?Math.round(v*100)/100:Math.round(v)});
  S.last=dCur;save();render();$('dlg').close();
};
$('amt').addEventListener('keydown',e=>{if(e.key==='Enter')$('dOk').click()});
$('bMan').onclick=()=>openAmt('');

/* scan */
function parseQR(txt){
  const m=txt.match(/(\d[\d,]*(?:\.\d+)?)\s*(\$|USD|៛|KHR|riel)/i)||txt.match(/(\$|USD|៛|KHR)\s*(\d[\d,]*(?:\.\d+)?)/i);
  if(!m)return null;
  const a=isNaN(m[1].replace(/,/g,''))?m[2]:m[1],u=isNaN(m[1].replace(/,/g,''))?m[1]:m[2];
  return{amt:a.replace(/,/g,''),cur:/\$|usd/i.test(u)?'USD':'KHR'};
}
function onCode(txt){
  txt=String(txt).trim();if(!txt)return false;
  if(S.items.some(i=>i.code===txt)){toast('កញ្ចប់នេះស្កេនរួចហើយ');return false}
  if(S.skip.includes(txt)){toast('គ្មាន COD (រំលង)');return false}
  beep();const p=parseQR(txt);
  if(p){S.items.push({id:uid(),code:txt,cur:p.cur,amt:+p.amt});S.last=p.cur;save();render();toast('បានបន្ថែម '+fmt(p.amt,p.cur));return true}
  openAmt(txt);return true;
}
let stream=null,det=null,running=false,cool=0,lastTxt='';
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    $('v').srcObject=stream;await $('v').play();$('cam').style.display='block';$('bScan').textContent='បិទកាមេរ៉ា';
    if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){det=null}}
    if(samp===undefined){try{samp=window.claude?await claude.use('sample'):null}catch(e){samp=null}}
    running=true;lastTxt='';loop();
  }catch(e){toast('បើកកាមេរ៉ាមិនបាន សូមប្រើ «ស្កេនពីរូប» ឬបញ្ចូលដោយដៃ')}
}
function stopCam(){running=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('cam').style.display='none';$('bScan').textContent='ស្កេន QR កញ្ចប់'}
$('bScan').onclick=()=>running?stopCam():startCam();
async function loop(){
  if(!running)return;
  const v=$('v');
  if(!$('dlg').open&&Date.now()>cool&&v.videoWidth){
    let txt=null,loc=null;
    try{
      if(det){const r=await det.detect(v);if(r.length){txt=r[0].rawValue;loc=r[0].cornerPoints}}
      else if(window.jsQR){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const d=cx.getImageData(0,0,cv.width,cv.height);const r=jsQR(d.data,d.width,d.height);if(r){txt=r.data;const L=r.location;loc=[L.topLeftCorner,L.topRightCorner,L.bottomRightCorner,L.bottomLeftCorner]}}
    }catch(e){}
    if(txt&&txt!==lastTxt){lastTxt=txt;cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);scanFrame(cv,txt,loc);cool=Date.now()+700}
  }
  setTimeout(loop,150);
}
$('bImg').onclick=()=>$('fImg').click();
$('fImg').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const img=new Image();
  img.onload=()=>{
    const s=Math.min(1,1600/Math.max(img.width,img.height));cv.width=img.width*s;cv.height=img.height*s;cx.drawImage(img,0,0,cv.width,cv.height);
    const r=window.jsQR&&jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);
    scanFrame(cv,r?r.data:'',r?[r.location.topLeftCorner,r.location.topRightCorner,r.location.bottomRightCorner,r.location.bottomLeftCorner]:null);
  };img.src=URL.createObjectURL(f);e.target.value='';
};

/* bank */
$('qOn').onchange=e=>{S.qrOn=e.target.checked;save()};
$('bQ').onclick=()=>$('fQ').click();
$('fQ').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const img=new Image();
  img.onload=()=>{const s=Math.min(1,1400/Math.max(img.width,img.height));cv.width=img.width*s;cv.height=img.height*s;cx.drawImage(img,0,0,cv.width,cv.height);
    const rr=window.jsQR&&jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);S.emv=rr&&/^0002/.test(rr.data)?rr.data:null;
    S.qr=cv.toDataURL('image/png');S.qrOn=true;save();render();makeQrFile();toast(S.emv?'បានរក្សាទុក QR ✓ អានបាន':'រក្សាទុកហើយ ប៉ុន្តែអាន QR មិនបាន')};
  img.src=URL.createObjectURL(f);e.target.value='';
};
$('bQd').onclick=()=>{if(S.qr)ask('លុប QR ABA?',()=>{S.qr=null;S.emv=null;S.qrOn=false;qrFile=null;save();render()})};
let askCb=null,qrFile=null,samp,editId=null,pend=new Set(),shUrl={},shFile={},ocrW=null;
async function ocrParse(cvs){
  if(!window.Tesseract)throw 1;
  if(!ocrW){toast('កំពុងរៀបចំ OCR ដំបូង...');ocrW=await Tesseract.createWorker('eng')}
  const t=(await ocrW.recognize(cvs)).data.text;
  const m=t.match(/C[O0Q]D[^0-9]{0,6}(\d[\d,.]*)\s*(\$|[^\d\s)]?)/i);
  if(!m){if(/C[O0Q]D/i.test(t))throw 2;return{cod:false}}
  const n=m[1].replace(/,/g,''),usd=m[2]==='$'||/\.\d{1,2}$/.test(n);
  return{cod:true,amount:parseFloat(n),currency:usd?'USD':'KHR'}
}
async function copyNum(c){const tot=sum(c);if(!(tot>0)){toast('មិនទាន់មានទឹកប្រាក់');return}
  const s=c==='USD'?tot.toFixed(2):String(Math.round(tot));
  try{await navigator.clipboard.writeText(s)}catch(e){const t=document.createElement('textarea');t.value=s;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.focus();t.select();t.setSelectionRange(0,99);document.execCommand('copy');t.remove()}
  toast('បានចម្លង '+s)}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let k=0;k<8;k++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function buildEMV(emv,amt,cur){const m=new Map();let i=0;while(i+4<=emv.length){const t=emv.substr(i,2),l=+emv.substr(i+2,2);if(isNaN(l))return null;m.set(t,emv.substr(i+4,l));i+=4+l}
  m.delete('63');m.set('53',cur==='USD'?'840':'116');m.set('54',cur==='USD'?amt.toFixed(2):String(Math.round(amt)));
  const s=[...m.keys()].sort().map(t=>{const v=m.get(t);return t+String(v.length).padStart(2,'0')+v}).join('')+'6304';return s+crc16(s)}
function qrCanvas(text){const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),z=8,b=4,c=document.createElement('canvas');c.width=c.height=(n+2*b)*z;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect((k+b)*z,(r+b)*z,z,z);return c}
function drawQR(){return;for(const [c,id] of [['USD','qU'],['KHR','qK']]){const tot=sum(c),el=$(id);shUrl[c]=null;shFile[c]=null;
  if(!S.emv||!(tot>0)||!window.qrcode){el.innerHTML='';continue}
  try{const k=qrCanvas(buildEMV(S.emv,tot,c)),u=k.toDataURL('image/png');shUrl[c]=u;el.innerHTML='<img alt="QR" src="'+u+'">';k.toBlob(b=>{if(b)shFile[c]=new File([b],'pay-'+c+'.png',{type:'image/png'})},'image/png')}catch(x){el.innerHTML=''}}}
function ask(m,cb){$('cmsg').textContent=m;askCb=cb;$('cdlg').showModal()}
$('cNo').onclick=()=>$('cdlg').close();
$('cYes').onclick=()=>{$('cdlg').close();if(askCb)askCb()};
$('bSave').onclick=()=>{save();toast('បានរក្សាទុករួចរាល់ ✓')};
async function makeQrFile(){qrFile=null;if(S.qr){try{qrFile=dataFile(S.qr,'aba-qr.png')}catch(e){}}}
function dataFile(u,name){const p=u.split(','),mime=p[0].match(/:(.*?);/)[1],bin=atob(p[1]),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new File([a],name,{type:mime})}
function showShare(c){const u=shUrl[c]||(S.qrOn?S.qr:null),im=$('simg');im.hidden=!u;if(u)im.src=u;$('stxt').value=(c==='USD'?'ដុល្លារ ':'រៀល ')+fmt(sum(c),c)+(c==='USD'?' $':' ៛')+S.accs.filter(a=>a.on).map(a=>'\n'+a.name+': '+a.no).join('');$('sdlg').showModal()}
$('sClose').onclick=()=>$('sdlg').close();
$('sCopy').onclick=async()=>{const el=$('stxt');try{await navigator.clipboard.writeText(el.value)}catch(e){el.select();document.execCommand('copy')}toast('បានចម្លង')};
$('eNo').onclick=()=>$('adlg').close();
$('eOk').onclick=()=>{const a=S.accs.find(x=>x.id===editId);if(a){a.name=$('en').value.trim()||a.name;a.no=$('eno').value.trim()||a.no;save();render()}$('adlg').close()};
async function scanFrame(c,code,loc){
  if(code){if(pend.has(code))return;if(S.items.some(i=>i.code===code)){toast('កញ្ចប់នេះស្កេនរួចហើយ');return}if(S.skip.includes(code)){toast('គ្មាន COD (រំលង)');return}}
  beep();
  if(samp===undefined){try{samp=window.claude?await claude.use('sample'):null}catch(e){samp=null}}
  if(!samp&&!window.Tesseract){openAmt(code);return}
  if(code)pend.add(code);toast('កំពុងអាន COD...');
  try{
    let sx=0,sy=0,sw=c.width,sh=c.height;
    if(loc&&loc.length){const X=loc.map(p=>p.x),Y=loc.map(p=>p.y),x0=Math.min(...X),x1=Math.max(...X),y0=Math.min(...Y),y1=Math.max(...Y),q=Math.max(x1-x0,y1-y0);sx=Math.max(0,x0-2*q);sy=Math.max(0,y0-.4*q);sw=Math.min(c.width,x1+.15*q)-sx;sh=Math.min(c.height,y1+.4*q)-sy}
    const sc=Math.min(samp?1:2,(samp?640:1000)/Math.max(sw,sh)),o=document.createElement('canvas');o.width=sw*sc;o.height=sh*sc;o.getContext('2d').drawImage(c,sx,sy,sw,sh,0,0,o.width,o.height);
    const blob=samp?await new Promise(r=>o.toBlob(r,'image/jpeg',.8)):null;
    const j=!samp?await ocrParse(o):await samp.json('This is a Cambodian parcel shipping label. Find the COD amount printed next to the word COD (left of the QR code), such as (7.00 $) or (20,000 ៛). Never use the delivery fee (ថ្លៃដឹក, marked PAID). If the word COD is not on the label, cod is false. Reply ONLY with JSON: {"cod":true or false,"amount":number,"currency":"USD" or "KHR"}',{images:[blob],modelTier:'quick',cache:false});
    if(j&&j.cod&&+j.amount>0){const cur=j.currency==='USD'?'USD':'KHR',amt=cur==='USD'?Math.round(j.amount*100)/100:Math.round(j.amount);S.items.push({id:uid(),code:code||'',cur,amt,ai:true});S.last=cur;save();render();toast('បានបន្ថែម '+fmt(amt,cur)+(cur==='USD'?' $':' ៛'))}
    else{if(code)pend.delete(code);toast('គ្មាន COD រំលង')}
  }catch(e){if(code)pend.delete(code);toast('អានមិនបាន សូមបញ្ចូលដោយដៃ');openAmt(code)}
}
$('aAdd').onclick=()=>{
  const n=$('an').value.trim(),o=$('ano').value.trim();
  S.accs=(n||o)?[{id:'acc',name:n,no:o,on:true}]:[];save();render();toast('បានរក្សាទុក');
};
function tickAcc(id,v){const a=S.accs.find(x=>x.id===id);if(a){a.on=v;save()}}
function editAcc(id){const a=S.accs.find(x=>x.id===id);if(!a)return;editId=id;$('en').value=a.name;$('eno').value=a.no;$('adlg').showModal()}
function delAcc(id){ask('លុបគណនីនេះ?',()=>{S.accs=S.accs.filter(a=>a.id!==id);save();render()})}
$('bClr').onclick=()=>{if(S.items.length||S.skip.length)ask('លុបបញ្ជីកញ្ចប់ទាំងអស់? (QR និងលេខគណនីមិនត្រូវលុបទេ)',()=>{S.items=[];S.skip=[];save();render()})};

/* share */
async function share(c){
  if(!(sum(c)>0)){toast('មិនទាន់មានទឹកប្រាក់');return}
  const f=S.qrOn&&S.qr?(qrFile||dataFile(S.qr,'aba-qr.png')):null,tx=!S.qrOn?'':S.accs.filter(a=>a.on).map(a=>a.name+': '+a.no).join('\n');if(!f&&!tx){toast('សូម tick QR ឬលេខគណនី');return}
  try{if(f){try{await navigator.share(tx?{files:[f],text:tx}:{files:[f]})}catch(e1){if(e1.name==='AbortError')return;await navigator.share({files:[f],title:'ABA QR',text:'ABA QR'})}}else await navigator.share({text:tx})}catch(e){if(e.name==='AbortError')return;if(S.qr)showShare(c);else toast('ចែករំលែកមិនបាន')}
}
async function shareOld(c){
  const list=S.items.filter(i=>i.cur===c);if(!list.length){toast('មិនទាន់មានទឹកប្រាក់');return}
  let t='COD '+(c==='USD'?'ដុល្លារ':'ប្រាក់រៀល')+'\n'+list.map((i,k)=>(k+1)+'. '+fmt(i.amt,c)).join('\n')+'\nសរុប: '+fmt(sum(c),c)+(c==='USD'?' $':' ៛');
  const ac=S.accs.filter(a=>a.on);if(ac.length)t+='\n\nគណនី:\n'+ac.map(a=>a.name+': '+a.no).join('\n');
  const data={text:t,title:'COD'};
  if(S.qrOn&&qrFile&&navigator.canShare&&navigator.canShare({files:[qrFile]}))data.files=[qrFile];
  try{if(navigator.share){await navigator.share(data);return}}catch(e){if(e.name==='AbortError')return}
  showShare(t);
}
$('sU').onclick=()=>share('USD');$('sK').onclick=()=>share('KHR');makeQrFile();
render();
</script>
